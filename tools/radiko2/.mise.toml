min_version = "2025.2.0"

[tools]
bun = "1.4.2"

[tasks.install]
description = "Bunの依存関係をインストール"
run = "bun install --frozen-lockfile"
sources = ["package.json", "bun.lock"]
outputs = ["node_modules"]

[tasks.build]
description = "TypeScriptをビルド"
depends = ["install"]
run = "bun run build"
sources = ["src/**/*.ts", "package.json", "tsconfig.json", "bun.lock"]
outputs = ["dist/**/*.js"]

[tasks.typecheck]
description = "TypeScriptの型チェック"
depends = ["install"]
run = "bun run typecheck"

[tasks.compile]
description = "Bunの単一実行ファイルを作成（macOS arm64）"
depends = ["typecheck"]
run = "bun run compile"
sources = ["src/**/*.ts", "package.json", "bun.lock"]
outputs = ["dist/radiko2"]

[tasks.download]
description = "radiko番組を検索してダウンロード"
depends = ["build"]
run = "bun run download \"$@\""

[tasks.help]
description = "ダウンロードコマンドのヘルプを表示"
depends = ["build"]
run = "bun run download --help"
